  paragraph1: We will be holding workshop sessions over Thanksgiving Break! Workshop sessions will be from 9 AM to 12 PM from November 23-27 (Monday-Friday). Students will learn mechanical design skills by using computer-aided design, laser cutters, and 3d printers to build a prototype robot mechanism that includes belts, pulleys, gears, and motors. <b>This program is for 5th-8th graders. Students should bring their own laptop each day. If your student needs to borrow a laptop, email arramanathan@palyrobotics.com.</b>
