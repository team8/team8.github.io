  paragraph1: We will be holding workshop sessions over Thanksgiving Break! Workshop sessions will be from <b>9 AM to 12 PM from November 23-27 (Monday - Friday)</b> at the <a href="https://www.google.com/maps/place/Paly+Robotics/@37.4355759,-122.156991,125a,35.4y,45t/data=!3m1!1e3!4m6!3m5!1s0x808fbb216c5ecd05:0x45098d5e7a83fa1f!8m2!3d37.436268!4d-122.155428!16s%2Fg%2F11c1r2bxb7!5m1!1e1?entry=ttu&g_ep=EgoyMDI2MTEwNC4wIKXMDSoASAFQAw%3D%3D">Paly Robotics Lab</a> (50 Embarcadero Rd, Palo Alto, CA 94301). Students will learn mechanical design skills by using computer-aided design, laser cutters, and 3d printers to build a prototype robot mechanism that includes belts, pulleys, gears, and motors. <b>This program is for 5th-8th graders. Students should bring their own laptop each day. If your student needs to borrow a laptop, email arramanathan@palyrobotics.com.</b>
  paragraph2: Email arramanathan@palyrobotics.com for any questions!
